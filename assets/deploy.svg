52" stroke="#ffffff" stroke-opacity="0.07"/><text x="640" y="278" font-size="15" font-weight="600" fill="#8e8e93">Start Command</text><text x="640" y="304" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">uvicorn server:app --host 0.0.0.0 --port $PORT</text><line x1="640" y1="318" x2="1172" y2="318" stroke="#ffffff" stroke-opacity="0.07"/><text x="640" y="344" font-size="15" font-weight="600" fill="#8e8e93">Health Check</text><text x="640" y="370" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/health</text><line x1="640" y1="384" x2="1172" y2="384" stroke="#ffffff" stroke-opacity="0.07"/><rect x="640" y="406" width="30" height="30" rx="7.8" fill="url(#gW)"/><rect x="640.5" y="406.5" width="29" height="29" rx="7.8" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(646.60 412.60) scale(0.7000)"><path d="M10.3 3.6c.8-1.3 2.6-1.3 3.4 0l8 13.6c.8 1.3-.2 3-1.7 3H4c-1.5 0-2.5-1.7-1.7-3z" fill="#fff"/><rect x="11" y="8" width="2" height="6.5" rx="1" fill="#f27c00"/><circle cx="12" cy="17" r="1.2" fill="#f27c00"/></g><text x="684" y="427" font-size="17" font-weight="600" fill="#ff9f0a">Строго один экземпляр, иначе бот упадёт с Conflict</text>

>По названию,</text><text x="644" y="238" font-size="18" font-weight="500" fill="#86868b">потом по синонимам</text><path d="M885.0 148.0l10 10-10 10" fill="none" stroke="#636366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="910.5" y="40.5" width="249" height="235" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/><rect x="911" y="41" width="248" height="234" rx="23.5" fill="none" stroke="url(#ai)" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.25;1" dur="4s" begin="3s" repeatCount="indefinite"/></rect><rect x="934" y="64" width="64" height="64" rx="16.64" fill="url(#g4)"/><rect x="934.5" y="64.5" width="63" height="63" rx="16.64" fill="none" stroke="#ffffff" stroke-opacity="0.18"/><g transform="translate(948.08 78.08) scale(1.4933)"><path fill-rule="evenodd" d="M2.5 4v6.6c0 .5.2 1 .6 1.4l9 9c.8.8 2 .8 2.8 0l6.2-6.2c.8-.8.8-2 0-2.8l-9-9A2 2 0 0 0 10.6 2.5H4A1.5 1.5 0 0 0 2.5 4zm5 1.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#fff"/></g><text x="1136" y="90" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#48484a" text-anchor="end">04</text><text x="934" y="176" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#f5f5f7">Результат</text><text x="934" y="212" font-size="18" font-weight="500" fill="#86868b">Горшок 2005 · 450 ₸</text><text x="934" y="238" font-size="18" font-weight="500" fill="#86868b">с фото и штрихкодом</text><line x1="40" y1="316" x2="1160" y2="316" stroke="#ffffff" stroke-opacity="0.08"/><text x="40" y="358" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>ИИ только называет предмет — цену и остальное берём из каталога, ничего не выдумывается</tspan></text><text x="40" y="394" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>«Горшки» находит «Горшок»: у длинных слов обрезаются окончания</tspan></text><text x="40" y="430" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>Каждый поиск пишется в </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">search_logs</tspan><tspan> — так видно, чего не хватает на складе</tspan></text>

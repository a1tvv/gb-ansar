ly="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs/stats</text><text x="716" y="477" font-size="16" font-weight="500" fill="#86868b">summary and top items not found</text><line x1="624" y1="484" x2="1152" y2="484" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="494" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="512" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="513" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs</text><text x="716" y="535" font-size="16" font-weight="500" fill="#86868b">raw search logs</text><line x1="624" y1="542" x2="1152" y2="542" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="552" width="76" height="26" rx="13" fill="#ff453a" fill-opacity="0.16"/><text x="662" y="570" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff453a" text-anchor="middle">DELETE</text><text x="716" y="571" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs</text><text x="716" y="593" font-size="16" font-weight="500" fill="#86868b">clear stats</text><line x1="624" y1="600" x2="1152" y2="600" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="610" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="628" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="629" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/categories</text><text x="716" y="651" font-size="16" font-weight="500" fill="#86868b">categories</text><line x1="624" y1="658" x2="1152" y2="658" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="668" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="662" y="686" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="716" y="687" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/categories</text><text x="716" y="709" font-size="16" font-weight="500" fill="#86868b">create a category</text><line x1="48" y1="736" x2="1152" y2="736" stroke="#ffffff" stroke-opacity="0.08"/><text x="48" y="776" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>All paths are under </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">/api</tspan><tspan>, except </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">GET /health</tspan><tspan>. Full schema is in Swagger at </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">/docs</tspan></text>

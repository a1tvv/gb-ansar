 rx="13" fill="#ff453a" fill-opacity="0.16"/><text x="86" y="456" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff453a" text-anchor="middle">DELETE</text><text x="140" y="457" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/{id}</text><text x="140" y="479" font-size="16" font-weight="500" fill="#86868b">delete together with photos</text><text x="48" y="526" font-size="15" font-weight="700" letter-spacing="1" fill="#8e8e93">SEARCH</text><rect x="48" y="552" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="86" y="570" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="140" y="571" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/search/photo</text><text x="140" y="593" font-size="16" font-weight="500" fill="#86868b">by photo</text><line x1="48" y1="600" x2="576" y2="600" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="610" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="628" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="629" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/search/text</text><text x="140" y="651" font-size="16" font-weight="500" fill="#86868b">by name, ?q=</text><line x1="48" y1="658" x2="576" y2="658" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="668" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="686" font-family="ui-monospace, 'SF Mono', SFMono-
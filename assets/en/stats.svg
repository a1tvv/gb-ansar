<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="One photo to find an item. 13 barcode formats. iOS, Android and Web. Telegram bot for the catalog.">
<defs><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f0a"/><stop offset="0.35" stop-color="#ff375f"/><stop offset="0.7" stop-color="#bf5af2"/><stop offset="1" stop-color="#0a84ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient><linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1"><stop offset="0.2" stop-color="#ffffff"/><stop offset="1" stop-color="#8e8e93"/></linearGradient><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter><clipPath id="t1"><rect width="590" height="540" rx="32"/></clipPath><linearGradient id="gPlus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#1e9e47"/></linearGradient><linearGradient id="gFind" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#0a84ff"/></linearGradient><linearGradient id="gEdit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#f27c00"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<g font-weight="600"><g clip-path="url(#t1)"><rect width="590" height="540" fill="url(#tile)"/><circle cx="470" cy="470" r="150" fill="url(#ai)" opacity="0.35" filter="url(#blur)"/></g><rect x="0.5" y="0.5" width="589" height="539" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/><text x="48" y="86" font-size="24" font-weight="600" fill="#86868b">To find an item</text><text x="30" y="420" font-size="360" font-weight="700" letter-spacing="-10" fill="url(#ai)">1</text><text x="236" y="418" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#titanium)">photo</text><text x="48" y="490" font-size="22" font-weight="600" fill="#86868b">AI sees the item and finds it in the catalog</text><rect x="610.5" y="0.5" width="589" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="658" y="86" font-size="24" font-weight="600" fill="#86868b">Scanner</text><g font-size="150" font-weight="700" letter-spacing="-4" fill="url(#blue)"><text x="650" y="218" opacity="0">10<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.000;0.250" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="650" y="218" opacity="0">11<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.250;0.500" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="650" y="218" opacity="0">12<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.500;0.750" calcMode="discrete" dur="0.8s" fill="freeze"/></text><text x="650" y="218">13<animate attributeName="opacity" values="0;1" keyTimes="0;0.750" calcMode="discrete" dur="0.8s" fill="freeze"/></text></g><text x="1152" y="170" font-size="32" font-weight="700" fill="#f5f5f7" text-anchor="end">code formats</text><text x="1152" y="208" font-size="22" font-weight="600" fill="#86868b" text-anchor="end">EAN · UPC · QR · DataMatrix</text><rect x="610.5" y="280.5" width="284" height="259" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="646" y="344" font-size="
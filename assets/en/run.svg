<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="537" rx="23.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><rect x="1" y="1" width="1198" height="59" rx="23" fill="#ffffff" fill-opacity="0.04"/><line x1="1" y1="60.5" x2="1199" y2="60.5" stroke="#ffffff" stroke-opacity="0.08"/><circle cx="34" cy="30" r="7" fill="#ff5f57"/><circle cx="58" cy="30" r="7" fill="#febc2e"/><circle cx="82" cy="30" r="7" fill="#28c840"/><text x="600" y="36" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#8e8e93" text-anchor="middle">zsh — gb-ansar</text><text x="48" y="122" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#636366"># Backend</tspan></text><text x="48" y="158" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">cd backend </tspan><tspan fill="#ff375f">&amp;&amp;</tspan><tspan fill="#f5f5f7"> pip install -r requirements.txt</tspan></text><text x="48" y="194" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">cp .env.example .env</tspan></text><text x="48" y="230" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">uvicorn server:app </tspan><tspan fill="#ffd60a">--reload</tspan></text><text x="48" y="266" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#64d2ff">INFO:     Uvicorn running on http://127.0.0.1:8000</tspan></text><text x="48" y="338" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#636366"># App — in a second terminal</tspan></text><text x="48" y="374" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">cd frontend </tspan><tspan fill="#ff375f">&amp;&amp;</tspan><tspan fill="#f5f5f7"> npm install</tspan></text><text x="48" y="410" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">cp .env.example .env</tspan></text><text x="48" y="446" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#30d158">$ </tspan><tspan fill="#f5f5f7">npx expo start</tspan></text><text x="48" y="482" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="20" xml:space="preserve" style="white-space:pre"><tspan fill="#64d2ff">› Press w │ open web</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="API: товары, поиск по фото, тексту и штрихкоду, заявки, статистика поиска, категории. Swagger на /docs.">
<defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#000000"/></linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="799" rx="31.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.1"/><text x="48" y="64" font-size="15" font-weight="700" letter-spacing="1" fill="#8e8e93">ТОВАРЫ</text><rect x="48" y="90" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="108" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="109" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products</text><text x="140" y="131" font-size="16" font-weight="500" fill="#86868b">список, фильтры, skip и limit</text><line x1="48" y1="138" x2="576" y2="138" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="148" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="166" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="167" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/paged</text><text x="140" y="189" font-size="16" font-weight="500" fill="#86868b">страницы: items, total, pages</text><line x1="48" y1="196" x2="576" y2="196" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="206" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="224" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="225" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/random</text><text x="140" y="247" font-size="16" font-weight="500" fill="#86868b">случайные для «Интересного»</text><line x1="48" y1="254" x2="576" y2="254" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="264" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="282" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="283" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/{id}</text><text x="140" y="305" font-size="16" font-weight="500" fill="#86868b">один товар</text><line x1="48" y1="312" x2="576" y2="312" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="322" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="86" y="340" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="140" y="341" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products</text><text x="140" y="363" font-size="16" font-weight="500" fill="#86868b">создать: фото в S3, ИИ пишет синонимы</text><line x1="48" y1="370" x2="576" y2="370" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="380" width="76" height="26" rx="13" fill="#ff9f0a" fill-opacity="0.16"/><text x="86" y="398" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff9f0a" text-anchor="middle">PUT</text><text x="140" y="399" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/{id}</text><text x="140" y="421" font-size="16" font-weight="500" fill="#86868b">обновить</text><line x1="48" y1="428" x2="576" y2="428" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="438" width="76" height="26" rx="13" fill="#ff453a" fill-opacity="0.16"/><text x="86" y="456" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff453a" text-anchor="middle">DELETE</text><text x="140" y="457" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/{id}</text><text x="140" y="479" font-size="16" font-weight="500" fill="#86868b">удалить вместе с фото</text><text x="48" y="526" font-size="15" font-weight="700" letter-spacing="1" fill="#8e8e93">ПОИСК</text><rect x="48" y="552" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="86" y="570" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="140" y="571" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/search/photo</text><text x="140" y="593" font-size="16" font-weight="500" fill="#86868b">по фото</text><line x1="48" y1="600" x2="576" y2="600" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="610" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="628" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="629" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/search/text</text><text x="140" y="651" font-size="16" font-weight="500" fill="#86868b">по названию, ?q=</text><line x1="48" y1="658" x2="576" y2="658" stroke="#ffffff" stroke-opacity="0.07"/><rect x="48" y="668" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="86" y="686" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="140" y="687" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/products/search/barcode</text><text x="140" y="709" font-size="16" font-weight="500" fill="#86868b">по штрихкоду, 404 если нет</text><text x="624" y="64" font-size="15" font-weight="700" letter-spacing="1" fill="#8e8e93">ЗАЯВКИ</text><rect x="624" y="90" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="662" y="108" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="716" y="109" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/pending-products</text><text x="716" y="131" font-size="16" font-weight="500" fill="#86868b">отправить, админы получат уведомление</text><line x1="624" y1="138" x2="1152" y2="138" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="148" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="166" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="167" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/pending-products</text><text x="716" y="189" font-size="16" font-weight="500" fill="#86868b">список заявок</text><line x1="624" y1="196" x2="1152" y2="196" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="206" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="224" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="225" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/pending-products/{id}</text><text x="716" y="247" font-size="16" font-weight="500" fill="#86868b">одна заявка</text><line x1="624" y1="254" x2="1152" y2="254" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="264" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="662" y="282" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="716" y="283" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/pending-products/{id}/approve</text><text x="716" y="305" font-size="16" font-weight="500" fill="#86868b">одобрить и перенести в каталог</text><line x1="624" y1="312" x2="1152" y2="312" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="322" width="76" height="26" rx="13" fill="#ff453a" fill-opacity="0.16"/><text x="662" y="340" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff453a" text-anchor="middle">DELETE</text><text x="716" y="341" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/pending-products/{id}</text><text x="716" y="363" font-size="16" font-weight="500" fill="#86868b">отклонить</text><text x="624" y="410" font-size="15" font-weight="700" letter-spacing="1" fill="#8e8e93">СТАТИСТИКА И ПРОЧЕЕ</text><rect x="624" y="436" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="454" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="455" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs/stats</text><text x="716" y="477" font-size="16" font-weight="500" fill="#86868b">сводка и топ ненайденного</text><line x1="624" y1="484" x2="1152" y2="484" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="494" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="512" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="513" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs</text><text x="716" y="535" font-size="16" font-weight="500" fill="#86868b">сырые логи поиска</text><line x1="624" y1="542" x2="1152" y2="542" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="552" width="76" height="26" rx="13" fill="#ff453a" fill-opacity="0.16"/><text x="662" y="570" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ff453a" text-anchor="middle">DELETE</text><text x="716" y="571" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/search-logs</text><text x="716" y="593" font-size="16" font-weight="500" fill="#86868b">очистить статистику</text><line x1="624" y1="600" x2="1152" y2="600" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="610" width="76" height="26" rx="13" fill="#64d2ff" fill-opacity="0.16"/><text x="662" y="628" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#64d2ff" text-anchor="middle">GET</text><text x="716" y="629" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/categories</text><text x="716" y="651" font-size="16" font-weight="500" fill="#86868b">категории</text><line x1="624" y1="658" x2="1152" y2="658" stroke="#ffffff" stroke-opacity="0.07"/><rect x="624" y="668" width="76" height="26" rx="13" fill="#30d158" fill-opacity="0.16"/><text x="662" y="686" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#30d158" text-anchor="middle">POST</text><text x="716" y="687" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#f5f5f7">/categories</text><text x="716" y="709" font-size="16" font-weight="500" fill="#86868b">создать категорию</text><line x1="48" y1="736" x2="1152" y2="736" stroke="#ffffff" stroke-opacity="0.08"/><text x="48" y="776" font-size="20" font-weight="500" fill="#d1d1d6"><tspan>Все пути под </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">/api</tspan><tspan>, кроме </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">GET /health</tspan><tspan>. Полная схема — в Swagger на </tspan><tspan font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#64d2ff">/docs</tspan></text>
</g>
</svg>
